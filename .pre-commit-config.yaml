repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: no-commit-to-branch
        args: [--branch, main]
    -   id: trailing-whitespace
    -   id: check-case-conflict
    -   id: check-added-large-files
        exclude: ^notebooks/(estimation/(rbc_with_growth|mixed_frequency_estimation)|introductory/second_order_solver)\.ipynb$

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.7
  hooks:
    - id: ruff-format
      types_or: [ python, pyi, jupyter ]
    - id: ruff
      args: [ --fix, --unsafe-fixes, --exit-non-zero-on-fix ]
      types_or: [ python, pyi, jupyter ]

- repo: https://github.com/MarcoGorelli/madforhooks
  rev: 0.4.1
  hooks:
    - id: check-execution-order
      args: [--strict]

- repo: local
  hooks:
    - id: pixi-lock-check
      name: pixi.lock is in sync with pyproject.toml
      entry: pixi lock --check
      language: system
      files: ^(pyproject\.toml|pixi\.lock)$
      pass_filenames: false

    - id: pixi-export-env
      name: conda_envs/environment_dev.yml is exported from the pixi default environment
      # The script calls pixi directly rather than through a pixi task so the hook reads the manifest only; `pixi run`
      # would re-solve the lock file and install the environment first.
      entry: python scripts/export_conda_env.py
      language: python
      files: ^(pyproject\.toml|pixi\.lock|conda_envs/environment_dev\.yml|scripts/export_conda_env\.py)$
      pass_filenames: false

    - id: check-ci-test-subsets
      name: CI test subsets name existing tests and run each once
      # Runs on test-file changes as well as workflow changes, because moving or deleting a test file is what
      # leaves a subset pointing at nothing.
      entry: python scripts/check_ci_test_subsets.py
      language: python
      additional_dependencies: [pyyaml]
      files: ^(\.github/workflows/run_tests\.yml|tests/.*\.py)$
      pass_filenames: false

    - id: docs-api
      name: API pages match the source
      entry: pixi run -e docs docs-api
      language: system
      pass_filenames: false
      files: ^(gEconpy/.*\.py|docs/generate_api\.py)$

    - id: docs-xrefs
      name: Docs cross-references resolve
      # The dummy builder resolves every reference without writing HTML. The output directory keeps Sphinx's cache, so
      # only modules whose files changed are re-read.
      entry: pixi run -e docs python -m sphinx -W --keep-going -q -b dummy docs/source docs/build/xref-check
      language: system
      pass_filenames: false
      files: ^(gEconpy/.*\.py|docs/.*|sphinxext/.*)$

    - id: notebook_name
      entry: '\(notebook_name\)='
      language: pygrep
      minimum_pre_commit_version: 2.8.0
      name: Check notebooks do not use literally notebook_name as target
      types: [jupyter]

    - id: no-references-as-links
      name: Check no references that should be sphinx cross-references are urls
      description: >-
        'A quick check to prevent urls pointing other sphinx built docs like pymc, arviz, numpy, scipy...'
      files: ^notebooks/.+\.ipynb$
      exclude: >
          (?x)(index.md|
               404.md|
               conf.py)
      entry: >
          (?x)(arviz-devs.github.io|
               pymc-experimental.readthedocs.io|
               docs.pymc.io|
               numpy.org/doc|
               pymc-examples.readthedocs.io|
               docs.python.org|
               xarray.pydata.org|
               python.arviz.org|
               pytensor.readthedocs.io|
               docs.xarray.dev|
               www.pymc.io|
               docs.scipy.org/doc)
      language: pygrep
      types_or: [markdown, rst, jupyter]
