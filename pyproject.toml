[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "gEconpy"
dynamic = ['version']
requires-python = ">=3.12"
authors = [{name="Jesse Grabowski", email='jessegrabowski@gmail.com'}]
description = "A package for solving, estimating, and analyzing DSGE models"
readme = 'README.md'
license = { file = 'LICENSE'}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

keywords = [
    "dynamic stochastic general equlibrium",
    "economics",
    "macroeconomics",
    "numerical",
    "simulation",
    "autodiff",
    "bayesian statistics"
]

dependencies = [
    "matplotlib",
    "numba",
    "numpy",
    "pandas",
    "pytensor>=3.3.2",
    "pymc>=6.3.0",
    "pymc_extras>=0.15.1",
    "preliz>=0.27.0",
    "pyparsing",
    "scipy",
    "sympy>=1.14.0",
    "sympytensor>=2.1.0",
    "better-optimize>=0.4.2",
    "ipython",
    "xarray",
    "networkx"
  ]

# pixi turns these extras into features of the same name.
[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-env",
    "numdifftools",
    "jax",
]

docs = [
  "ipython",
  "myst-nb",
  "numpydoc",
  "sphinx>=9.1.0",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-codeautolink",
  "pydata-sphinx-theme",
  "watermark",
]

[tool.hatch.version]
source = 'vcs'

[tool.hatch.build.hooks.vcs]
version-file = "gEconpy/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
  '/.github',
]

[tool.hatch.build.targets.wheel]
packages = ["gEconpy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "9.0"
xfail_strict=true
log_cli=true
log_cli_level="INFO"
# Force the non-interactive matplotlib backend so plotting tests never open a window.
env = ["MPLBACKEND=Agg"]
filterwarnings = [
    "error",
    # JAX issues an over-eager warning if os.fork() is called when the JAX module is loaded, even if JAX isn't being used
    'ignore:os\.fork\(\) was called\.:RuntimeWarning',

    # OpenMP library warning on windows CI
    'ignore::RuntimeWarning:threadpoolctl',

    # ArviZ warning related to 1.0 release
    'ignore:\nArviZ is undergoing a major refactor.*:FutureWarning',

    # sympy 1.14 calls mpmath's bitcount, which mpmath 1.4 deprecated; the warning aborts sympy's
    # assumption lookups under warnings-as-errors and surfaces as KeyError: 'finite'
    'ignore:bitcount function is deprecated:DeprecationWarning',

    # Upstream deprication warning from sympytensor
    'ignore:The `broadcastable` keyword is deprecated; use `shape`:DeprecationWarning',

    # Scipy lambdify can easily hit numerical issues that are not relevant to our tests
    'ignore:invalid value encountered in scalar power:RuntimeWarning',

    # Upstream preliz/pytensor_distributions calls pt.random.gamma with deprecated rate arg
    'ignore:Gamma rate argument is deprecated.*:FutureWarning',

    # Upstream preliz/pytensor_distributions builds RandomVariable Ops without return_next_rng
    'ignore:RandomVariable Ops will stop hiding the rng output.*:DeprecationWarning',

    'ignore:.*is faster on contiguous arrays.*:numba.core.errors.NumbaPerformanceWarning',
]

markers = [
    "include_nk: mark tests using the full new keyenesian model (which can be quite slow)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "B",                # flake8-bugbear
  "UP",               # pyupgrade
  "I",                # isort
  "C4",               # flake8-comprehensions
  "SIM",              # flake8-simplify
  "ARG",              # flake8-unused-arguments
  "PTH",              # flake8-use-pathlib
  "TID",              # flake8-tidy-imports
  "DTZ",              # flake8-datetimez
  "RET",              # flake8-return
  "PERF",             # perflint
  "TRY",              # try/except best practices
  "PL",               # pylint-inspired rules
  "NPY",              # numpy-specific rules
  "RUF",              # Ruff-specific
  "D",                # pydocstyle
  "C90",              # mccabe complexity
  "T10",              # flake8-debugger
  "T20",              # flake8-print
]
ignore = [
    "RUF001", # Allow Greek letters in strings
    "RUF002", # Allow Greek letters in docstrings
    "RUF012", # Mutable class attributes without ClassVar
    "PLR0913", # Allow functions with many arguments
    "PLR0917", # Allow functions with many positional arguments
    "PLR2004", # Allow magic numbers
    "TRY003", # Allow custom exception messages

    # Allow missing docstrings; enforce style where present
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",

    # Recommended when using Ruff's formatter
    "W191",
    "E111", "E114", "E117",
    "D206", "D300",
    "Q000", "Q001", "Q002", "Q003",
    "COM812", "COM819",
    "ISC001", "ISC002",
]

allowed-confusables = ["×"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
'gEconpy/__init__.py' = [
    "E402", # Must set PYTENSOR_FLAGS before importing pytensor
]

'gEconpy/solvers/gensys.py' = [
    "ARG002", # Allow unused arguments in Pytensor Op classes
    "C901",    # Allow high complexity in the gensys core loop
    "PLR0912", # Allow many branches (zxz / n_unstable edge cases)
    "PLR0915", # Allow many statements — gensys is naturally long
]

'gEconpy/solvers/cycle_reduction.py' = [
    "ARG002", # Allow unused arguments in Pytensor Op classes
]

'gEconpy/pytensorf/block.py' = [
    "C901", # Vendored from pytensor verbatim; keep upstream structure
]

'gEconpy/model/*.py' = [
    "C901" ,  # Allow high complexity in model definition
    "PLR0912", # Allow many branches
    "PLR0915", # Allow many statements,
    "PLR2004", # Allow magic numbers in model definition
]

'gEconpy/model/perturbation.py' = [
    "ARG002", # Allow unused arguments in Pytensor Op classes
]

'gEconpy/parser/*.py' = [
    'PLR0915', # Allow long functions in parser
    'C901',  # Allow high complexity in parser
]

'gEconpy/dynare_convert.py' = [
    'PLR0912', # Allow many branches in dynare converter
    'C901', # Allow high complexity in dynare converter
]

'tests/*.py' = [
    'F401', # Unused import warning for test files -- this check removes imports of fixtures
    'F811',  # Redefine while unused -- this check fails on imported fixtures
    'F841', # Unused variable warning for test files -- common in pymc model declarations
    'D106',  # Missing docstring for public method -- unittest test subclasses don't need docstrings
    "PLR2004", # Allow magic numbers in test files
    "E741", # Allow single letter variable names in test files (e.g. I for investment)
    "ARG003", # Allow unused arguments in test-double classmethods implementing an interface
]

'tests/model/test_statespace.py' = [
    'ARG005'
]

'scripts/regenerate_expected_gcn_errors.py' = ["T201"]
'docs/generate_api.py' = ["T201"]
'tests/parser/test_expected_errors.py' = ["T201"]

'notebooks/*/*.ipynb' = [
    'F821', # Notebooks uses direct assignment to globals, so ruff thinks variables are not declared
    'PLR2004', # Allow magic numbers in notebooks
    'PTH113', # TODO: fix pathlib usage in notebooks
    'T201', # Notebooks print
]

# pixi reads [project].dependencies, requires-python and the extras above on its own. The tables
# here only add what the project metadata cannot say: which packages come from conda-forge instead
# of PyPI (a conda entry overrides the PyPI requirement of the same name), and platform toolchains.
# The pixi-export-env pre-commit hook renders the `default` environment to
# conda_envs/environment_dev.yml.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

# The compiled stack resolves from conda-forge.
[tool.pixi.dependencies]
numpy = "*"
numba = "*"
pytensor = ">=3.3.2"
pymc = ">=6.3.0"

# gxx 16.2.0 on conda-forge win-64 cannot link (ld cannot find dllcrt2.o);
# see conda-forge/ctng-compilers-feedstock#229 and m2w64-sysroot-feedstock#23.
[tool.pixi.target.win-64.dependencies]
gxx_win-64 = "16.1.*"

[tool.pixi.pypi-dependencies]
geconpy = { path = ".", editable = true }

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

# Everything the example notebooks import at runtime beyond the package itself, plus the tools that execute
# them and keep the jupytext pairs in sync. No win-64: conda-forge has no jaxlib there, and flowjax needs jax.
[tool.pixi.feature.notebooks]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.notebooks.dependencies]
arviz-plots = "*"
arviz-stats = "*"
flowjax = "*"
ipykernel = "*"
jupytext = "*"
nbconvert = "*"
nutpie = "*"
preliz = "*"
python-graphviz = "*"
watermark = "*"
xarray-einstats = "*"

[tool.pixi.feature.notebooks.pypi-dependencies]
kuznets = "*"
time-series-transformers = "*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = { features = ["dev", "docs", "py312"], solve-group = "py312" }
docs = { features = ["docs", "py312"], solve-group = "py312" }
py313 = { features = ["dev", "py313"] }
notebooks = { features = ["dev", "docs", "notebooks", "py312"], solve-group = "py312" }

[tool.pixi.tasks]
# Extra arguments pass through, e.g. `pixi run test tests/model -m "not include_nk"`. The XML report goes
# to the repository root: a coverage/ directory there is an importable namespace package that shadows the
# real coverage module numba imports.
test = "python -m pytest -vv --cache-clear --cov=gEconpy --cov-report=xml:coverage.xml --no-cov-on-fail --cov-report term --durations=50"
lint = "pre-commit run --all-files"
docs-build = { cmd = "python -m sphinx -W --keep-going -b html source build/html", cwd = "docs" }
docs-api = "python docs/generate_api.py"
# Execute one example notebook in place, then write its jupytext pair: `pixi run -e notebooks nb-run notebooks/x.ipynb`.
nb-run = { cmd = "python -m jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=5400 '{{ notebook }}' && python -m jupytext --quiet --sync '{{ notebook }}'", args = ["notebook"] }
