name: geconpy
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Core dependencies
  - python=3.13
  - pymc>=6.3.0
  - pytensor>=3.3.0
  - matplotlib
  - numba
  - numpy
  - pandas
  - pyparsing
  - scipy<1.18.1  # conda-forge's 1.18.1 build breaks pytensor's numba cython_special lookups
  - setuptools
  - statsmodels
  - preliz>=0.27.0
  - sympy>=1.14.0
  - better-optimize>=0.4.2
  - ipython
  - nutpie>=0.16.10
  - networkx

  - pip:
      - pymc-extras>=0.15.0
      - sympytensor>=2.1.0
      - jax>=0.10.1
      - flowjax
