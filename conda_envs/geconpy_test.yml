name: geconpy-test
channels:
- conda-forge
- nodefaults
dependencies:
  # Base dependencies
  - numpy
  - numba
  - scipy<1.18.1  # conda-forge's 1.18.1 build breaks pytensor's numba cython_special lookups
  - sympy>=1.14.0
  - pyparsing
  - pandas
  - xarray
  - matplotlib
  - arviz>=1.1.0
  - statsmodels
  - pymc>=6.3.0
  - pytensor>=3.3.0
  - sympytensor>=2.1.0
  - pymc-extras>=0.15.0
  - preliz>=0.27.0
  - ipython
  - better-optimize>=0.4.2
  - nutpie>=0.16.10
  - networkx

  # Testing dependencies
  - pre-commit
  - pytest-cov>=7.1.0
  - pytest>=9.0.3
  - pytest-env

  - pip
  - pip:
      - numdifftools
      - jax
