name: geconpy-dev
channels:
- conda-forge
- nodefaults
dependencies:
- python 3.12.*
- python >=3.12
- numpy *
- numba *
- pytensor >=3.3.2
- pymc >=6.3.0
- pip
- pip:
  - pre-commit
  - pytest>=9.0.3
  - pytest-cov>=7.1.0
  - pytest-env
  - numdifftools
  - jax
  - ipython
  - myst-nb
  - numpydoc
  - sphinx>=9.1.0
  - sphinx-copybutton
  - sphinx-design
  - sphinx-codeautolink
  - pydata-sphinx-theme
  - watermark
  - -e .
  - matplotlib
  - numba
  - numpy
  - pandas
  - pytensor>=3.3.2
  - pymc>=6.3.0
  - pymc-extras>=0.15.1
  - preliz>=0.27.0
  - pyparsing
  - scipy
  - sympy>=1.14.0
  - sympytensor>=2.1.0
  - better-optimize>=0.4.2
  - xarray
  - networkx
